<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        .container { position: relative; z-index: 2; text-align: center; width: 100%; max-width: 500px; padding: 20px; }
        
        /* Text Animations */
        .matrix-text { font-size: 3rem; font-weight: bold; color: #ff2a85; text-shadow: 0 0 10px #ff2a85; opacity: 0; transition: opacity 0.5s ease; }
        
        /* Interactive Card Flip */
        .card-container { perspective: 1000px; display: none; margin: 20px auto; width: 280px; height: 360px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s; }
        .card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-shadow: 0 0 20px rgba(255,42,133,0.5); }
        .card-front { background: #fff; color: #000; }
        .card-back { background: rgba(20, 20, 20, 0.95); border: 2px solid #ff2a85; color: #fff; transform: rotateY(180deg); }
        
        /* Heart Grid Container */
        .heart-grid { display: none; position: relative; width: 320px; height: 320px; margin: 0 auto; }
        .heart-photo { position: absolute; width: 70px; height: 70px; object-fit: cover; border-radius: 50%; border: 2px solid #ff2a85; box-shadow: 0 0 10px #ff2a85; animation: popIn 0.5s ease forwards; }
        
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div id="text-display" class="matrix-text"></div>

    <div id="card-container" class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-front">
                <span style="font-size: 50px;">💌</span>
                <p style="margin-top: 15px; font-weight: bold;">Tap to Open</p>
            </div>
            <div class="card-back">
                <p style="font-size: 1.1rem; line-height: 1.5;">Happy Birthday Sanuu! ❤️<br><br>As long as you're smiling, I'm happy. Stay happy, my love.</p>
            </div>
        </div>
    </div>

    <div id="heart-grid" class="heart-grid"></div>
</div>

<script>
    // Matrix Rain Animation
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = '0123456789ABCDEF♥💕✨';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff2a85';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 33);

    // Sequence Controller
    const textDisplay = document.getElementById('text-display');
    const cardContainer = document.getElementById('card-container');
    const heartGrid = document.getElementById('heart-grid');

    const sequence = ['3', '2', '1', 'HAPPY', 'BIRTHDAY', 'TO', 'SANUU', '❤️'];
    let seqIndex = 0;

    function runSequence() {
        if (seqIndex < sequence.length) {
            textDisplay.innerText = sequence[seqIndex];
            textDisplay.style.opacity = '1';
            
            setTimeout(() => {
                textDisplay.style.opacity = '0';
                seqIndex++;
                setTimeout(runSequence, 400);
            }, 1000);
        } else {
            textDisplay.style.display = 'none';
            cardContainer.style.display = 'block';
        }
    }

    setTimeout(runSequence, 1000);

    // Image Links
    const photoUrls = [
        "https://i.ibb.co/9HFyhzzF/IMG-20251206-130940.jpg",
        "https://i.ibb.co/fGB4dbK1/IMG-20251206-131819.jpg",
        "https://i.ibb.co/0R1JwqY0/IMG-20251017-175214.jpg",
        "https://i.ibb.co/nq86nDxQ/IMG-20260120-135043.jpg",
        "https://i.ibb.co/CXcbMzy/IMG-20260120-135712.jpg"
    ];

    // Heart Coordinates Layout
    const heartPositions = [
        { top: '20px', left: '125px' },
        { top: '60px', left: '60px' },
        { top: '60px', left: '190px' },
        { top: '130px', left: '20px' },
        { top: '130px', left: '230px' },
        { top: '210px', left: '70px' },
        { top: '210px', left: '180px' },
        { top: '270px', left: '125px' }
    ];

    let isFlipped = false;
    function flipCard() {
        const card = document.getElementById('card');
        card.classList.toggle('flipped');
        
        if (!isFlipped) {
            isFlipped = true;
            setTimeout(() => {
                cardContainer.style.display = 'none';
                heartGrid.style.display = 'block';
                
                // Populate heart photos dynamically
                heartPositions.forEach((pos, index) => {
                    const img = document.createElement('img');
                    img.src = photoUrls[index % photoUrls.length];
                    img.className = 'heart-photo';
                    img.style.top = pos.top;
                    img.style.left = pos.left;
                    img.style.animationDelay = (index * 0.15) + "s";
                    heartGrid.appendChild(img);
                });
            }, 2500);
        }
    }
</script>

</body>
</html>
