<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Sanuu! ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #333;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 20px;
      margin: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #e91e63;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.1rem;
      line-height: 1.6;
      color: #555;
    }
    .heart {
      font-size: 3rem;
      animation: pulse 1.5s infinite;
      margin: 15px 0;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }
    .wish-box {
      background: #ffe6ed;
      border-left: 4px solid #e91e63;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="heart">💖</div>
    <h1>Happy Birthday Sanuu! 🎉</h1>
    
    <div class="wish-box">
      <p>Wishing you the happiest birthday filled with lots of love, joy, and laughter! You deserve all the happiness in the world. ❤️</p>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 20px;">
  <img src="photo1.jpg" style="width: 100%; border-radius: 12px;">
  <img src="photo2.jpg" style="width: 100%; border-radius: 12px;">
  <img src="photo3.jpg" style="width: 100%; border-radius: 12px;">
  <img src="photo4.jpg" style="width: 100%; border-radius: 12px;">
  <img src="photo5.jpg" style="width: 100%; border-radius: 12px;">
  <img src="photo6.jpg" style="width: 100%; border-radius: 12px;">
  </div>q

</body>
</html>
