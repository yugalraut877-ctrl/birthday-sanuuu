<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday To You Sanuuu! ❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }

    /* Floating Photos Rain */
    .photo-rain {
      position: fixed;
      top: -150px;
      width: 110px;
      background: white;
      padding: 8px 8px 25px 8px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
      border-radius: 4px;
      animation: fall 10s linear infinite;
      z-index: 1;
      pointer-events: none;
    }
    .photo-rain img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 2px;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(115vh) rotate(360deg); opacity: 0; }
    }

    /* Container */
    .card-container {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h1 {
      color: #ff4b2b;
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 1rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* Interactive Cake */
    .cake {
      width: 120px;
      height: 90px;
      background: #f48fb1;
      border-radius: 10px 10px 0 0;
      margin: 20px auto;
      position: relative;
      box-shadow: inset 0 -10px 0 #ec407a;
      cursor: pointer;
    }
    .candle {
      width: 12px;
      height: 35px;
      background: #fff;
      position: absolute;
      top: -35px;
      left: 54px;
      border-radius: 3px;
    }
    .flame {
      width: 14px;
      height: 20px;
      background: #ff9800;
      border-radius: 50% 50% 20% 20%;
      position: absolute;
      top: -18px;
      left: -1px;
      animation: flicker 0.6s infinite alternate;
      box-shadow: 0 0 10px #ffeb3b;
    }

    @keyframes flicker {
      0% { transform: scale(1); }
      100% { transform: scale(1.2); }
    }

    .btn {
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
      transition: 0.3s;
    }
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="card-container">
    <h1>Happy Birthday Sanuuu! 🎉❤️</h1>
    <p>To the most incredible person, wishing you a day filled with love, magic, and endless happiness!</p>

    <div class="cake" onclick="blowCandle()">
      <div class="candle">
        <div class="flame" id="flame"></div>
      </div>
    </div>

    <button class="btn" onclick="playMusicAndConfetti()">Click for Birthday Surprise! 🎁</button>
  </div>

  <script>
    const photos = [
      'photo1.jpg', 'photo2.jpg', 'photo3.jpg', 'photo4.jpg', 'photo5.jpg', 'photo6.jpg',
      'https://i.ibb.co/LDTDPd2d/IMG-20260502-WA0008.jpg',
      'https://i.ibb.co/3ykf1G31/IMG-20260502-WA0005.jpg',
      'https://i.ibb.co/8L44m5YV/IMG-20260502-WA0004.jpg',
      'https://i.ibb.co/PZrBsnqB/IMG-20260502-WA0003.jpg',
      'https://i.ibb.co/jP3V4ZfK/IMG-20260502-WA0002.jpg',
      'https://i.ibb.co/qF4jJ3kL/IMG-20260502-WA0001.jpg',
      'https://i.ibb.co/PG5P3q1v/IMG-20260502-WA0007.jpg',
      'https://i.ibb.co/213v814F/IMG-20260502-WA0006.jpg'
    ];

    function createPhotoRain() {
      const photo = document.createElement('div');
      photo.classList.add('photo-rain');
      photo.style.left = Math.random() * 85 + 'vw';
      photo.style.animationDuration = (Math.random() * 4 + 6) + 's';
      
      const randomImg = photos[Math.floor(Math.random() * photos.length)];
      photo.innerHTML = `<img src="${randomImg}" alt="Memory">`;
      
      document.body.appendChild(photo);
      setTimeout(() => photo.remove(), 10000);
    }

    setInterval(createPhotoRain, 800);

    function playMusicAndConfetti() {
      const music = document.getElementById('bg-music');
      music.play();
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }

    function blowCandle() {
      const flame = document.getElementById('flame');
      flame.style.display = 'none';
      confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
    }
  </script>
</body>
</html>
