<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday To You Sanuu! 😚</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
    .container { position: relative; z-index: 10; text-align: center; width: 100%; max-width: 600px; padding: 20px; }

    /* Matrix & Countdown Text */
    .big-text {
      font-size: 3.5rem;
      font-weight: bold;
      color: #ff2a85;
      text-shadow: 0 0 20px #ff2a85;
      animation: popIn 0.5s ease-in-out;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Interactive Cake */
    .cake-box { display: none; cursor: pointer; text-align: center; margin-top: 20px; }
    .cake { position: relative; width: 140px; height: 100px; background: #f48fb1; border-radius: 10px 10px 0 0; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .cake::before { content: ''; position: absolute; bottom: -15px; left: -10px; width: 160px; height: 15px; background: #ad1457; border-radius: 10px; }
    .candle { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); width: 12px; height: 35px; background: #fff; border-radius: 3px; }
    .flame { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 14px; height: 20px; background: #ff9800; border-radius: 50% 50% 20% 20%; animation: flicker 0.6s infinite alternate; box-shadow: 0 0 10px #ffeb3b; }
    .flame.off { display: none; }

    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      100% { transform: translateX(-50%) scale(1.1); }
    }

    /* Floating Photo Rain */
    .photo-rain {
      position: fixed;
      top: -150px;
      width: 110px;
      background: #fff;
      padding: 6px 6px 20px 6px;
      box-shadow: 0 0 15px rgba(255, 42, 133, 0.6);
      border-radius: 6px;
      animation: fall 7s linear infinite;
      z-index: 5;
      pointer-events: none;
    }
    .photo-rain img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 3px;
      display: block;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(115vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Audio Background Link -->
  <audio id="bg-music" loop preload="auto">
    <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-sun-683.mp3" type="audio/mpeg">
  </audio>

  <canvas id="matrix"></canvas>

  <div class="container">
    <div id="text-display" class="big-text">3</div>

    <div id="cake-box" class="cake-box" onclick="blowCandle()">
      <p style="color: #ff2a85; font-size: 1.2rem; font-weight: bold; margin-bottom: 15px;">Tap the candle to blow it out! 🎂</p>
      <div class="cake">
        <div class="candle">
          <div class="flame" id="flame"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const photos = [
      'photo1.jpg', 'photo2.jpg', 'photo3.jpg', 'photo4.jpg', 'photo5.jpg',
      'photo6.jpg', 'photo7.jpg', 'photo8.jpg', 'photo9.jpg', 'photo10.jpg',
      'photo11.jpg', 'photo12.jpg', 'photo13.jpg', 'photo14.jpg'
    ];

    let started = false;

    // Starts countdown immediately, audio plays on first touch/interaction
    function init() {
      if (!started) {
        started = true;
        const audio = document.getElementById('bg-music');
        audio.play().catch(() => {});
        startCountdown();
      }
    }

    document.body.addEventListener('click', init);
    document.body.addEventListener('touchstart', init);

    // Auto start countdown immediately on load
    window.onload = () => {
      startCountdown();
    };

    const textDisplay = document.getElementById('text-display');

    function startCountdown() {
      const sequence = ["3", "2", "1", "HAPPY", "BIRTHDAY", "TO", "YOU", "SANUU! 😚"];
      let index = 0;

      const interval = setInterval(() => {
        if (index < sequence.length) {
          textDisplay.innerText = sequence[index];
          index++;
        } else {
          clearInterval(interval);
          textDisplay.style.display = 'none';
          document.getElementById('cake-box').style.display = 'block';
        }
      }, 1000);
    }

    function blowCandle() {
      document.getElementById('flame').classList.add('off');
      confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });

      setTimeout(() => {
        document.getElementById('cake-box').style.display = 'none';
        startPhotoRain();
      }, 1200);
    }

    function startPhotoRain() {
      setInterval(() => {
        const photo = document.createElement('div');
        photo.classList.add('photo-rain');
        photo.style.left = Math.random() * 85 + 'vw';
        photo.style.animationDuration = (Math.random() * 3 + 5) + 's';

        const randomImg = photos[Math.floor(Math.random() * photos.length)];
        photo.innerHTML = `<img src="${randomImg}" onerror="this.src='https://picsum.photos/200/200'" alt="Memory">`;

        document.body.appendChild(photo);
        setTimeout(() => photo.remove(), 8000);
      }, 600);
    }

    // Matrix Background Effect
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = 'SANUUUHAPPYBIRTHDAYTOYOU1234567890😚';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff2a85';
      ctx.font = fontSize + 'px monospace';

      drops.forEach((y, i) => {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, y * fontSize);
        if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }
    setInterval(drawMatrix, 33);
  </script>
</body>
</html>
