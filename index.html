<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sanuu!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; color: #fff; font-family: 'Courier New', monospace; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        .container { position: relative; z-index: 2; text-align: center; width: 100%; max-width: 600px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }

        /* Rotate Screen Prompt */
        .rotate-hint { position: fixed; top: 10px; color: #ff2a85; font-size: 0.9rem; z-index: 10; background: rgba(0,0,0,0.8); padding: 8px 15px; border-radius: 20px; border: 1px solid #ff2a85; display: block; }

        /* Birthday Cake CSS */
        .cake-box { cursor: pointer; text-align: center; animation: fadeIn 1s ease-in; }
        .cake { position: relative; width: 140px; height: 100px; background: #f48fb1; border-radius: 10px 10px 0 0; margin: 40px auto 0; box-shadow: inset 0 12px 0 #f06292, inset 0 24px 0 #fff; }
        .cake::before { content: ''; position: absolute; bottom: -15px; left: -10px; width: 160px; height: 15px; background: #ad1457; border-radius: 5px; }
        .candle { position: absolute; top: -35px; left: 50%; transform: translateX(-50%); width: 12px; height: 35px; background: #fff; border-radius: 3px; }
        .flame { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 14px; height: 20px; background: #ff9800; border-radius: 50% 50% 20% 20%; box-shadow: 0 0 12px #ffeb3b; animation: flicker 0.3s infinite alternate; }
        .flame.off { display: none; }
        
        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.1); }
        }

        /* Matrix Text */
        .matrix-text { font-size: 3.5rem; font-weight: bold; color: #ff2a85; text-shadow: 0 0 15px #ff2a85; opacity: 0; transition: opacity 0.5s ease; display: none; }

        /* Interactive Card */
        .card-container { perspective: 1000px; display: none; margin: 0 auto; width: 320px; height: 220px; cursor: pointer; }
        .card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s; }
        .card.flipped { transform: rotateY(180deg); }
        .card-front, .card-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 15px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-shadow: 0 0 20px rgba(255,42,133,0.6); }
        .card-front { background: #fff; color: #000; }
        .card-back { background: rgba(20, 20, 20, 0.95); border: 2px solid #ff2a85; color: #fff; transform: rotateY(180deg); }

        /* Heart Grid (Horizontal Optimized) */
        .heart-grid { display: none; position: relative; width: 480px; height: 260px; margin: 0 auto; }
        .heart-photo { position: absolute; width: 65px; height: 65px; object-fit: cover; border-radius: 50%; border: 2px solid #ff2a85; box-shadow: 0 0 10px #ff2a85; animation: popIn 0.5s ease forwards; }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="rotate-hint">🔄 Turn screen horizontally for best view!</div>
<canvas id="matrix"></canvas>

<div class="container">
    <!-- Cake Scene -->
    <div id="cake-box" class="cake-box" onclick="blowCandle()">
        <p style="color: #ff2a85; font-size: 1.2rem; font-weight: bold; margin-bottom: 10px;">Tap the candle to blow it out! 🎂</p>
        <div class="cake">
            <div class="candle">
                <div id="flame" class="flame"></div>
            </div>
        </div>
    </div>

    <!-- Countdown Text -->
    <div id="text-display" class="matrix-text"></div>

    <!-- Birthday Card -->
    <div id="card-container" class="card-container" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-front">
                <span style="font-size: 40px;">💌</span>
                <p style="margin-top: 10px; font-weight: bold;">Tap to Open</p>
            </div>
            <div class="card-back">
                <p style="font-size: 1rem; line-height: 1.4;">Happy Birthday Sanuu! ❤️<br><br>As long as you're smiling, I'm happy. Stay happy, my love.</p>
            </div>
        </div>
    </div>

    <!-- Heart Gallery -->
    <div id="heart-grid" class="heart-grid"></div>
</div>

<script>
    // Matrix Rain Effect
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const chars = '0123456789ABCDEF♥💕✨';
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff2a85';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 33);

    // Flow sequence setup
    let candleBlown = false;
    function blowCandle() {
        if (candleBlown) return;
        candleBlown = true;
        
        document.getElementById('flame').classList.add('off');
        
        setTimeout(() => {
            document.getElementById('cake-box').style.display = 'none';
            document.getElementById('text-display').style.display = 'block';
            runSequence();
        }, 1200);
    }

    const textDisplay = document.getElementById('text-display');
    const cardContainer = document.getElementById('card-container');
    const heartGrid = document.getElementById('heart-grid');

    const sequence = ['3', '2', '1', 'HAPPY', 'BIRTHDAY', 'TO', 'SANUU', '❤️'];
    let seqIndex = 0;

    function runSequence() {
        if (seqIndex < sequence.length) {
            textDisplay.innerText = sequence[seqIndex];
            textDisplay.style.opacity = '1';
            
            setTimeout(() => {
                textDisplay.style.opacity = '0';
                seqIndex++;
                setTimeout(runSequence, 300);
            }, 900);
        } else {
            textDisplay.style.display = 'none';
            cardContainer.style.display = 'block';
        }
    }

    // Photo URLs
    const photoUrls = [
        "https://i.ibb.co/9HFyhzzF/IMG-20251206-130940.jpg",
        "https://i.ibb.co/fGB4dbK1/IMG-20251206-131819.jpg",
        "https://i.ibb.co/0R1JwqY0/IMG-20251017-175214.jpg",
        "https://i.ibb.co/nq86nDxQ/IMG-20260120-135043.jpg",
        "https://i.ibb.co/CXcbMzy/IMG-20260120-135712.jpg"
    ];

    // Horizontal Heart Layout Coordinates
    const heartPositions = [
        { top: '10px', left: '210px' },
        { top: '40px', left: '130px' },
        { top: '40px', left: '290px' },
        { top: '100px', left: '70px' },
        { top: '100px', left: '350px' },
        { top: '160px', left: '130px' },
        { top: '160px', left: '290px' },
        { top: '210px', left: '210px' }
    ];

    let isFlipped = false;
    function flipCard() {
        const card = document.getElementById('card');
        card.classList.toggle('flipped');
        
        if (!isFlipped) {
            isFlipped = true;
            setTimeout(() => {
                cardContainer.style.display = 'none';
                heartGrid.style.display = 'block';
                
                heartPositions.forEach((pos, index) => {
                    const img = document.createElement('img');
                    img.src = photoUrls[index % photoUrls.length];
                    img.className = 'heart-photo';
                    img.style.top = pos.top;
                    img.style.left = pos.left;
                    img.style.animationDelay = (index * 0.15) + "s";
                    heartGrid.appendChild(img);
                });
            }, 2500);
        }
    }
</script>

</body>
</html>
